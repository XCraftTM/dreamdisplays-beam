plugins {
    // obfuscated versions (up to 1.21.11) are remapped from Mojang's mappings; 26.x is not obfuscated
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// one source tree for every supported Minecraft version: ./gradlew build -Pminecraft_version=1.21.1
apply from: 'preprocess.gradle'
def mc = project.minecraft_version
def at = { String v -> ppCompareVersions(mc, v) >= 0 }
def obfuscated = !at('26')
apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) throw new GradleException("Minecraft ${mc} is not supported (no ${versionFile.name})")
def deps = new Properties()
versionFile.withInputStream { deps.load(it) }
def javaRelease = deps.java_version as int

version = "${project.mod_version}+${mc}"
group = project.maven_group
base { archivesName = 'dreamdisplays-beam' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// dev only: a test scene and a driver that takes screenshots
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

ext.ppMinecraft = mc
ext.ppLoader = 'fabric'
preprocessSources(['src/main/java'], ['**/*.java'])
preprocessSources(['src/testmod/java'], ['**/*.java'], [], 'testmod')

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${deps.fabric_api_version}"
        modImplementation "maven.modrinth:dreamdisplays:${deps.dreamdisplays_version}"
        if (project.shaders.toBoolean()) {
            modLocalRuntime "maven.modrinth:iris:${deps.iris_version}"
            modLocalRuntime "maven.modrinth:sodium:${deps.sodium_version}"
        }
    } else {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${deps.fabric_api_version}"
        implementation "maven.modrinth:dreamdisplays:${deps.dreamdisplays_version}"
        if (project.shaders.toBoolean()) {
            localRuntime "maven.modrinth:iris:${deps.iris_version}"
            localRuntime "maven.modrinth:sodium:${deps.sodium_version}"
        }
    }
}

// versions where the game hides what the mod needs and Fabric API does not open it
def accessWidener = file("src/main/accesswideners/${mc}.accesswidener")

// the test runs: quick play exists from 1.20 (before, the test driver opens the world itself)
def quickPlay = at('1.20')
loom {
    if (accessWidener.exists()) accessWidenerPath = accessWidener
    mods {
        ddbeam { sourceSet sourceSets.main }
        ddbeam_test { sourceSet sourceSets.testmod }
    }
    runs {
        // the test scene: a room with a display, the cast started on it, screenshots (see README)
        autotest {
            client()
            name = 'Beam auto test'
            source sourceSets.testmod
            runDir = "run/autotest/${mc}"
            if (quickPlay) programArgs '--quickPlaySingleplayer', 'beam-test'
            programArgs '--width', '1280', '--height', '720', '--username', 'Caster'
            vmArgs '-Xmx3G'
            if (javaRelease >= 22) vmArg '--enable-native-access=ALL-UNNAMED'
            if (!project.hasProperty('testMode')) vmArg '-Dddbeam.test.mode=cast'
            ['testPrefix': 'prefix', 'testMode': 'mode', 'testSource': 'source', 'testRes': 'res', 'testFps': 'fps', 'testVideo': 'video', 'testDepth': 'depth', 'testFacing': 'facing', 'testBottom': 'bottom'].each { prop, key ->
                if (project.hasProperty(prop)) vmArg "-Dddbeam.test.${key}=${project.property(prop)}"
            }
        }
        // the caster of a streaming test on a separate server (e.g. the Paper test server on port 25700)
        caster {
            client()
            name = 'Beam caster'
            source sourceSets.testmod
            runDir = "run/caster/${mc}"
            // -PtestServer=host:port, e.g. a relay in front of the test server
            if (quickPlay) programArgs '--quickPlayMultiplayer', project.findProperty('testServer') ?: '127.0.0.1:25700'
            programArgs '--width', '1280', '--height', '720', '--username', 'Caster'
            // -PtestMode=cast: the dialog test on that server (e.g. one without Beam: "Stream to players" greyed out)
            vmArgs '-Xmx3G', "-Dddbeam.test.mode=${project.findProperty('testMode') ?: 'stream'}", '-Dddbeam.test.server=127.0.0.1:25700'
            if (javaRelease >= 22) vmArg '--enable-native-access=ALL-UNNAMED'
            ['testPrefix': 'prefix', 'testSource': 'source', 'testRes': 'res', 'testFps': 'fps', 'testVideo': 'video', 'testDepth': 'depth', 'testFacing': 'facing', 'testBottom': 'bottom'].each { prop, key ->
                if (project.hasProperty(prop)) vmArg "-Dddbeam.test.${key}=${project.property(prop)}"
            }
            if (project.hasProperty('noStreamGate')) vmArg '-Dddbeam.noStreamGate=true'
        }
        // a second player for the streaming test: joins the caster's world opened to LAN (port 25700)
        viewer {
            client()
            name = 'Beam viewer'
            source sourceSets.testmod
            runDir = "run/viewer/${mc}"
            if (quickPlay) programArgs '--quickPlayMultiplayer', '127.0.0.1:25700'
            programArgs '--width', '1280', '--height', '720', '--username', 'Viewer'
            vmArgs '-Xmx3G', '-Dddbeam.test.mode=viewer', '-Dddbeam.test.server=127.0.0.1:25700'
            if (javaRelease >= 22) vmArg '--enable-native-access=ALL-UNNAMED'
            if (project.hasProperty('testPrefix')) vmArg "-Dddbeam.test.prefix=${project.property('testPrefix')}"
        }
    }
}

processResources {
    def props = [version: project.version, minecraft: "~${mc}", java: javaRelease, mixinJava: Math.min(javaRelease, 21),
                 accessWidener: accessWidener.exists() ? '"accessWidener": "ddbeam.accesswidener",' : '']
    if (accessWidener.exists()) from(accessWidener) { rename { 'ddbeam.accesswidener' } }
    inputs.properties props
    filesMatching(['fabric.mod.json', 'ddbeam.mixins.json']) { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
    it.options.encoding = 'UTF-8'
}

// obfuscated versions: the remapped jar is the release
if (obfuscated) {
    remapJar { archiveFileName = "dreamdisplays-beam-${project.mod_version}+${mc}.jar" }
} else {
    jar { archiveFileName = "dreamdisplays-beam-${project.mod_version}+${mc}.jar" }
}
