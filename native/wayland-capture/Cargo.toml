[package]
name = "ddbeam-wayland"
version = "0.1.0"
edition = "2021"
description = "Dream Displays Beam: screen and window capture on Wayland (desktop portal + PipeWire), raw frames on stdout"
license = "MIT"
publish = false

[dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["rt", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
